<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渡海 · 画风对照预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e6dc;color:#1b2825;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}header,main,footer{max-width:1500px;margin:auto;padding:26px 30px}header{border-bottom:1px solid #263b3233}header small{letter-spacing:3px;color:#a34c22;font-weight:700}h1{font-size:clamp(26px,4vw,46px);margin:10px 0}p{margin:8px 0;color:#58655b}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,a{font:inherit}button{border:1px solid #253b32;background:transparent;color:#253b32;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#253b32;color:#fff4d8}a{color:#a34c22}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{display:flex;gap:8px;align-items:baseline;margin-bottom:12px}figcaption b{font-size:22px}figcaption small{color:#687067}figure img{display:block;width:100%;height:auto;border:1px solid #23382b44}main.single{grid-template-columns:1fr;max-width:900px}figure[hidden]{display:none}footer{border-top:1px solid #263b3233;font-size:13px}footer strong{color:#a34c22}@media(max-width:700px){header,main,footer{padding:20px 14px}main{gap:12px}figcaption{display:block}figcaption b{font-size:17px}figcaption small{display:block;font-size:10px}}
</style>
<header><small>STRAIT FRONT / ART DIRECTION</small><h1>同一片战场，两种画风。</h1><p>左侧是现版实机截图，右侧是同构图的像素方向概念图。正式游戏仍保留现有美术。</p><p>比较舰船轮廓、军队辨识和地图密度。像素图是 imagegen 生成的静态概念，文字与细节可能有偏差，尚未验证动画与地图缩放。</p><nav aria-label="对照模式"><button data-mode="both" aria-pressed="true">并排对照</button><button data-mode="current" aria-pressed="false">只看现版</button><button data-mode="pixel" aria-pressed="false">只看像素</button></nav></header>
<main><figure id="current"><figcaption><b>01 / 现版</b><small>实机截图 · 手绘素材与真实地图</small></figcaption><img src="current-game.png" alt="现版实机截图，台海地图上的手绘军队与舰船"></figure><figure id="pixel"><figcaption><b>02 / 像素方向</b><small>概念预览 · 尚未实装</small></figcaption><img src="pixel-concept.png" alt="同一战局的像素画风概念图，海岸线、舰船和军队以像素表现"></figure></main>
<footer><strong>建议：先统一军队、舰船和特效的像素比例，地图保留准确地理，文字保持清晰。</strong><p>这张预览不代表整套像素素材已经完成。<a href="../../?v=2.3.0">返回 2.3 正式游戏 →</a></p></footer>
<script>for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{const mode=button.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',b===button);document.querySelector('main').classList.toggle('single',mode!=='both');document.getElementById('current').hidden=mode==='pixel';document.getElementById('pixel').hidden=mode==='current';};</script></html>
